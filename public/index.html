<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Playground</title>
    <link rel="icon" type="image/svg+xml" href="assets/devtalk_logo.svg">
    <link rel="stylesheet" href="styles.css">
    <!-- Markdown & Highlight Support -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>

<body>
    <div id="mobileHeader" class="mobile-only-header">
        <button id="btnToggleLeft" class="mobile-toggle-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <div class="mobile-app-title">DevTalk</div>
        <button id="btnToggleRight" class="mobile-toggle-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                </path>
            </svg>
        </button>
    </div>

    <div id="sidePaneOverlay" class="panel-overlay"></div>

    <div class="container">
        <!-- Left Panel: Model Configuration -->
        <div class="panel left-panel" id="leftPanel">
            <div class="mobile-panel-header mobile-only">
                <h3>Model Config</h3>
                <button class="close-panel-btn" onclick="toggleSidebar('left')">×</button>
            </div>
            <div class="panel-header">
                Model Configuration
                <div class="header-actions">
                    <button class="icon-btn" id="btnExportModels" title="Export Models">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </button>
                    <button class="icon-btn" id="btnImportModels" title="Import Models">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </button>
                    <input type="file" id="importModelsFile" accept=".json" style="display: none;">
                </div>
            </div>
            <div class="panel-content">
                <div class="input-group">
                    <label>API Key</label>
                    <div class="api-key-container">
                        <input type="password" id="apiKey" placeholder="sk-...">
                        <button class="icon-btn" id="toggleApiKey" title="Show/Hide">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label>Model Name</label>
                    <input type="text" id="modelName" placeholder="lightning-ai/gpt-oss-20b">
                </div>

                <div class="input-group">
                    <label>Base URL</label>
                    <input type="text" id="baseUrl" placeholder="https://lightning.ai/api/v1">
                </div>

                <div class="param-row">
                    <div class="input-group">
                        <label>Temperature</label>
                        <input type="number" id="temperature" value="0.7" step="0.1" min="0" max="2">
                    </div>
                    <div class="input-group">
                        <label>Max Tokens</label>
                        <input type="number" id="maxTokens" value="2048" step="100">
                    </div>
                </div>

                <div class="input-group">
                    <label>System Prompt (For this Tab)</label>
                    <textarea id="systemPrompt" style="min-height: 80px;" placeholder="System prompt..."></textarea>
                </div>

                <div class="div-line" style="border-top: 1px solid #2a2a2a; margin: 16px 0;"></div>

                <div class="btn-group">
                    <button id="btnAddModel">Add Model</button>
                    <button class="secondary" id="btnUpdateModel">Update</button>
                </div>

                <div class="model-list" id="modelList"></div>
            </div>
        </div>

        <!-- Middle Panel: Chat -->
        <div class="panel middle-panel">
            <div class="tabs" id="tabs"></div>
            <div class="chat-container">
                <div class="messages" id="messages"></div>

                <div class="input-area">
                    <div id="status" class="status" style="display: none;"></div>

                    <div class="input-row">
                        <textarea id="userInput" placeholder="Type your message..."></textarea>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <button id="btnSend">Send</button>
                            <button class="secondary" id="btnClear">Clear</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel: Tools & Options -->
        <div class="panel right-panel" id="rightPanel">
            <div class="mobile-panel-header mobile-only">
                <h3>Tools & Options</h3>
                <button class="close-panel-btn" onclick="toggleSidebar('right')">×</button>
            </div>
            <div class="panel-header">Tools & Options</div>
            <div class="panel-content">

                <div class="input-group"
                    style="margin-bottom: 16px; padding: 10px; background: #222; border-radius: 4px; text-align: center;">
                    <label style="margin-bottom: 4px;">Total Token Usage (Tab)</label>
                    <div id="tokenUsage" style="font-size: 16px; font-weight: bold; color: #4caf50;">0</div>
                    <div style="border-top: 1px solid #333; margin: 8px 0;"></div>
                    <label style="margin-bottom: 4px;">Tokens (History)</label>
                    <div id="tokenHistory" style="font-size: 16px; font-weight: bold; color: #2196f3;">0</div>
                </div>

                <!-- Tool Management -->
                <div class="input-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="enableTools">
                        <label for="enableTools">Enable Tools</label>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="enableMarkdown" checked>
                        <label for="enableMarkdown">Enable Markdown Rendering</label>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="enableStreaming">
                        <label for="enableStreaming">Enable Streaming</label>
                    </div>
                </div>

                <div class="input-group">
                    <label>Tools JSON Definition (Edit Here)</label>
                    <textarea id="toolsEditor" class="tool-json-input"></textarea>
                    <div class="btn-group">
                        <button class="secondary" id="btnResetTools">Reset to Default</button>
                        <button class="secondary" id="btnFormatTools">Format JSON</button>
                    </div>
                </div>

                <div class="input-group" style="margin-top: 16px;">
                    <label>Tool Implementations (JavaScript)</label>
                    <textarea id="toolCodeEditor" class="tool-json-input" placeholder="// Return an object with function names matching tool definitions
return {
    get_weather: (args) => {
        return { 
            location: args.location, 
            temp: 22, 
            condition: 'Sunny' 
        };
    }
};"></textarea>
                </div>

                <div style="border-top: 1px solid #2a2a2a; margin: 16px 0;"></div>

                <!-- Code Generator -->
                <div class="input-group">
                    <label>Generate Code</label>
                    <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                        <select id="codeGenLang">
                            <option value="curl">cURL</option>
                            <option value="python">Python (requests)</option>
                            <option value="js">Node.js (fetch)</option>
                        </select>
                    </div>
                    <textarea id="codeOutput" class="tool-json-input" style="height: 150px;" readonly
                        placeholder="Generated code will appear here..."></textarea>
                    <button class="secondary" id="btnCopyGenCode" style="width: 100%; margin-top: 4px;">Copy
                        Code</button>
                </div>

                <div style="border-top: 1px solid #2a2a2a; margin: 16px 0;"></div>

                <div class="btn-group" style="flex-direction: column;">
                    <button class="secondary" onclick="document.getElementById('importFile').click()">Import
                        Chat</button>
                    <button class="secondary" id="btnExport">Export Chat</button>
                </div>
                <input type="file" id="importFile" accept=".json" style="display: none;">

                <div class="sidebar-footer">
                    <a href="https://github.com/Myster-Pmf/DevTalk" target="_blank" class="github-link">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
                            </path>
                        </svg>
                        View on GitHub
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Confirmation Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Clear Chat History?</h3>
            <p id="modalMessage">This action cannot be undone.</p>
            <div class="modal-actions">
                <button id="modalBtnCancel" class="secondary">Cancel</button>
                <button id="modalBtnConfirm" class="danger">Clear</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
